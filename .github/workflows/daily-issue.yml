name: Create Daily Issue

on:
  schedule:
    - cron: '0 15 * * 0-4' # 매일 00:00 KST (월~금)

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          gh issue create --repo ${{ github.repository }} --title "$DATE" --body ""
